[project]
name = "pyshell-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyshell",
    "transformers>=5.3,<6",
    "peft>=0.18,<1",
    "psutil>=7,<8",
    "numpy>=2,<3",
    "pandas>=3,<4",
]

[project.optional-dependencies]
cpu = ["torch>=2.10,<3"]
cuda = ["torch>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "--import-mode=importlib"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
pyshell = { path = "../protocol", editable = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
