[project]
name = "pyshell-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyshell",
    "pydantic>=2.10,<3",
    "huggingface-hub>=1,<3",
    "transformers>=5.3,<6",
    "peft>=0.18,<1",
    "trl>=1.17,<2",
    "datasets>=4,<6",
]

[project.optional-dependencies]
cpu = ["torch>=2.10,<3"]
cuda = [
    "torch==2.10.0",
    "causal-conv1d==1.7.0; sys_platform == 'linux'",
    "flash-linear-attention[cuda]==0.6.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "--import-mode=importlib"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }, "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "causal-conv1d"
version = "1.7.0"
requires-python = ">=3.9"
requires-dist = ["torch", "packaging", "ninja"]

[tool.uv.sources]
pyshell = { path = "../protocol", editable = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
