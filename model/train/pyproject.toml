[project]
name = "pyshell-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.10,<3",
    "transformers>=5.3,<6",
    "peft>=0.18,<1",
    "psutil>=7,<8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
