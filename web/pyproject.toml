[project]
name = "pyshell-web"
version = "0.0.0"
description = "A Python-only terminal agent with immediate execution and feedback"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.15.0",
    "pydantic-ai-slim[openai]>=1.107.9,<2",
]

[dependency-groups]
dev = ["pyshell", "pytest>=8,<10"]

[tool.uv.sources]
pyshell = { path = "../api", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = [
    "F", "UP", "D", "DTZ", "I", "ICN", "PIE", "RET", "ARG", "N",
    "PERF", "PTH", "A", "S", "ASYNC", "ANN", "B006", "E302", "E305",
    "E262", "E265", "C403", "C419",
    "PGH003", "PT", "RUF100", "TID252",
]
ignore = ["D100", "D104", "D202", "D203", "D213"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "D", "N803", "S"]
"script.py" = ["S113"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true
split-on-trailing-comma = false
