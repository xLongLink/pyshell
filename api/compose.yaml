name: pyshell

services:
  pyshell:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      PYSHELL_REQUIREMENTS: ${PYSHELL_REQUIREMENTS:-}
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:size=512m,mode=1777,exec
    volumes:
      - workspace:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  workspace:
