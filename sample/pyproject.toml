[project]
name = "pyshell-web"
version = "0.0.0"
description = "Browser workspace and agent API for the Python execution container"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx2>=2.16,<3",
    "pydantic-settings>=2.15.0",
    "pydantic-ai-slim[openai-realtime]>=2.61,<3",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = [
    "F", "UP", "D", "DTZ", "I", "ICN", "PIE", "RET", "ARG", "N",
    "PERF", "PTH", "A", "S", "ASYNC", "ANN", "B006", "E302", "E305",
    "E262", "E265", "C403", "C419",
    "PGH003", "PT", "RUF100", "TID252",
]
ignore = ["D100", "D104", "D202", "D203", "D213"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
no-sections = true
length-sort = true
split-on-trailing-comma = false
