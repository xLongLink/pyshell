[project]
name = "portfolio-demo"
version = "0.1.0"
description = "Reproducible synthetic portfolio data for the PyShell demo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_demo"]
