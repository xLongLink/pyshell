<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyShell</title>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <main>
        <p id="workspace-error" role="alert" hidden></p>
        <iframe title="Python workspace" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>
    </main>
    <div class="voice">
        <button id="voice" type="button" data-state="off" aria-label="Start voice" aria-pressed="false" disabled>
            <particles-orb id="voice-orb" size="128" color-from="#fde047" color-to="#f59e0b" state="disabled" aria-hidden="true"></particles-orb>
        </button>
        <p id="voice-error" role="alert" hidden></p>
    </div>
    <script type="module">
        import "/particles-orb.mjs";
        import { mountVoice } from "/voice.mjs";
        const widgets = new URL("/", window.location.href);
        widgets.port = "8000";
        document.querySelector("iframe").src = widgets.href;
        mountVoice();
    </script>
</body>
</html>
