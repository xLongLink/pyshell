name: Cleanup

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cleanup-pipeline
  cancel-in-progress: false

jobs:
  cleanup:
    uses: Sau1707/openconfig/.github/workflows/cleanup.yml@main
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
