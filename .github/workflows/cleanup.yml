name: cleanup

on:
    workflow_dispatch:
    pull_request_target:
        types: [closed]
    schedule:
        - cron: '0 */12 * * *'

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: opencode-cleanup
    cancel-in-progress: false

jobs:
    cleanup:
        if: >-
            github.event_name != 'pull_request_target' ||
            (github.event.pull_request.head.ref == 'automation/opencode-cleanup' &&
             github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: self-hosted
        timeout-minutes: 90
        defaults:
            run:
                working-directory: repository
                shell: bash
        steps:
            - name: Check out the default branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  path: repository
                  persist-credentials: false

            - name: Initialize cleanup
              id: base
              run: |
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  temporary=$(mktemp -d "$RUNNER_TEMP/opencode-cleanup.XXXXXX")
                  echo "CLEANUP_TEMP=$temporary" >> "$GITHUB_ENV"
                  echo "TMPDIR=$temporary" >> "$GITHUB_ENV"
                  echo "CLEANUP_REPORT=$temporary/cleanup-report.md" >> "$GITHUB_ENV"

            - name: Check for an existing cleanup PR
              id: pending
              uses: actions/github-script@v8
              with:
                  script: |
                      const { data: pulls } = await github.rest.pulls.list({
                        ...context.repo,
                        state: 'open',
                        head: `${context.repo.owner}:automation/opencode-cleanup`,
                        per_page: 1,
                      });
                      if (pulls.length) {
                        await core.summary.addRaw('A cleanup PR is already awaiting review; skipping.').write();
                        core.setOutput('skip', 'true');
                      }

            - name: Sync OpenCode configuration
              if: steps.pending.outputs.skip != 'true'
              run: |
                  config="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
                  source=$(mktemp -d "$CLEANUP_TEMP/openconfig.XXXXXX")
                  git clone --depth 1 --branch main https://github.com/Sau1707/openconfig.git "$source"
                  mkdir -p "$config"
                  git -C "$source" archive HEAD | tar -x -C "$config"
                  echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
                  export PATH="$HOME/.opencode/bin:$PATH"
                  opencode --version

            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
              if: steps.pending.outputs.skip != 'true'
              with:
                  version: '0.13.4'

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              if: steps.pending.outputs.skip != 'true'
              with:
                  node-version: '26'

            - name: Check runner prerequisites
              if: steps.pending.outputs.skip != 'true'
              run: |
                  make --version

            - name: Implement cleanup findings
              if: steps.pending.outputs.skip != 'true'
              timeout-minutes: 35
              run: |
                  opencode run --standalone --auto --agent loop "@cleanup Find simplification opportunities"
                  opencode run --standalone --auto --continue --agent build "Implement everything High or Medium"

            - name: Verify and repair cleanup changes
              if: steps.pending.outputs.skip != 'true'
              timeout-minutes: 35
              run: |
                  log="$CLEANUP_TEMP/cleanup-validation.log"
                  for attempt in 1 2 3; do
                    if bash -e -o pipefail <<'CHECKS' 2>&1 | tee "$log"; then
                  npm --prefix src/web ci
                  make format
                  uvx ruff==0.17.3 check .
                  uvx ruff==0.17.3 format --check .
                  uvx pyunslop==0.0.4
                  uv run --directory src/api --locked --python 3.10 pytest -v
                  uv run --directory src/api --locked --python 3.12 pytest -v
                  uv run --directory model/protocol --locked --python 3.12 pytest -v
                  npm --prefix src/web test
                  git diff --check HEAD
                  CHECKS
                      echo "Validation passed on attempt $attempt." >> "$GITHUB_STEP_SUMMARY"
                      break
                    fi
                    if [[ "$attempt" == 3 ]]; then
                      echo 'Cleanup validation failed after three attempts; no PR will be created.' >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                    fi
                    opencode run --standalone --auto --continue --agent build "Read the validation failures in $log and fix the cleanup changes so all checks pass. Preserve intended behavior and existing test coverage. Do not weaken tests, disable checks, change lint rules, or modify .github files. Do not commit, push, or create a pull request. The workflow will rerun all checks after your changes."
                  done

            - name: Generate cleanup report
              if: steps.pending.outputs.skip != 'true'
              run: |
                  opencode run --standalone --auto --continue --agent build "Generate a Markdown pull request description based on the final diff and actual verification results in $CLEANUP_TEMP/cleanup-validation.log. Write the description to the absolute path in CLEANUP_REPORT. Use the headings ## Summary and ## Validation. Include a summary of the implemented changes, checks that passed or failed, and any remaining limitations. If nothing changed, state that explicitly. Do not include secrets or raw environment output. Do not modify repository files, commit, push, or create a pull request."

            - name: Validate the resulting changes
              if: steps.pending.outputs.skip != 'true'
              env:
                  BASE_SHA: ${{ steps.base.outputs.sha }}
              run: |
                  test -s "$CLEANUP_REPORT"
                  test "$(git rev-parse HEAD)" = "$BASE_SHA"
                  python3 - <<'PY'
                  import subprocess

                  changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only', '-z'])
                  untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'])
                  for path in (changed + untracked).decode().split('\0'):
                      if path == '.github' or path.startswith('.github/'):
                          raise SystemExit('Cleanup must not modify GitHub Actions configuration.')
                  PY
                  git diff --check HEAD

            - name: Create cleanup pull request
              if: steps.pending.outputs.skip != 'true'
              id: pull-request
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ secrets.CLEANUP_TOKEN }}
                  path: repository
                  base: ${{ github.event.repository.default_branch }}
                  branch: automation/opencode-cleanup
                  commit-message: 'refactor: cleanup'
                  title: 'refactor: cleanup'
                  labels: refactor
                  body-path: ${{ env.CLEANUP_REPORT }}

            - name: Remove job temporary files
              if: always()
              working-directory: ${{ runner.temp }}
              run: |
                  export TMPDIR="$RUNNER_TEMP"
                  echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
                  if [[ -n "${CLEANUP_TEMP:-}" && "$CLEANUP_TEMP" == "$RUNNER_TEMP"/opencode-cleanup.* ]]; then
                    rm -rf -- "$CLEANUP_TEMP"
                  fi
