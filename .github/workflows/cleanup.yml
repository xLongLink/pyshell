name: cleanup

on:
    workflow_dispatch:
    schedule:
        - cron: '0 */12 * * *'

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: opencode-cleanup
    cancel-in-progress: false

jobs:
    cleanup:
        runs-on: self-hosted
        timeout-minutes: 60
        defaults:
            run:
                working-directory: repository
                shell: bash
        steps:
            - name: Check out the default branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  path: repository
                  persist-credentials: false

            - name: Initialize cleanup
              id: base
              run: |
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  echo "CLEANUP_REPORT=$RUNNER_TEMP/cleanup-report.md" >> "$GITHUB_ENV"

            - name: Check for an existing cleanup PR
              id: pending
              uses: actions/github-script@v8
              with:
                  script: |
                      const { data: pulls } = await github.rest.pulls.list({
                        ...context.repo,
                        state: 'open',
                        head: `${context.repo.owner}:automation/opencode-cleanup`,
                        per_page: 1,
                      });
                      if (pulls.length) {
                        await core.summary.addRaw('A cleanup PR is already awaiting review; skipping.').write();
                        core.setOutput('skip', 'true');
                      }

            - name: Sync OpenCode configuration
              if: steps.pending.outputs.skip != 'true'
              run: |
                  config="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
                  if [[ -d "$config/.git" ]]; then
                    git -C "$config" pull --ff-only origin main
                  else
                    git clone --branch main https://github.com/Sau1707/openconfig.git "$config"
                  fi
                  echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
                  export PATH="$HOME/.opencode/bin:$PATH"
                  opencode --version

            - name: Implement cleanup findings
              if: steps.pending.outputs.skip != 'true'
              timeout-minutes: 35
              run: |
                  opencode run --standalone --auto --agent loop "@cleanup Find simplification opportunities"
                  opencode run --standalone --auto --continue --agent build "Implement everything High or Medium"
                  opencode run --standalone --auto --continue --agent build "Generate a Markdown pull request description based on the final diff and actual verification results from this session. Write the description to the absolute path in CLEANUP_REPORT. Use the headings ## Summary and ## Validation. Include a summary of the implemented changes, checks that passed or failed, and any remaining limitations. If nothing changed, state that explicitly. Do not include secrets or raw environment output. Do not modify repository files, commit, push, or create a pull request."

            - name: Validate the resulting changes
              if: steps.pending.outputs.skip != 'true'
              env:
                  BASE_SHA: ${{ steps.base.outputs.sha }}
              run: |
                  test -s "$CLEANUP_REPORT"
                  test "$(git rev-parse HEAD)" = "$BASE_SHA"
                  python3 - <<'PY'
                  import subprocess

                  changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only', '-z'])
                  untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'])
                  for path in (changed + untracked).decode().split('\0'):
                      if path == '.github' or path.startswith('.github/'):
                          raise SystemExit('Cleanup must not modify GitHub Actions configuration.')
                  PY
                  git diff --check HEAD

            - name: Create cleanup pull request
              if: steps.pending.outputs.skip != 'true'
              id: pull-request
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ secrets.CLEANUP_TOKEN }}
                  path: repository
                  base: ${{ github.event.repository.default_branch }}
                  branch: automation/opencode-cleanup
                  commit-message: 'refactor: cleanup'
                  title: 'refactor: cleanup'
                  labels: refactor
                  body-path: ${{ env.CLEANUP_REPORT }}
