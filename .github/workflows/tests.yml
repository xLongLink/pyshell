name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
          enable-cache: true
      - run: uv run --locked --python "${PYTHON_VERSION}" pytest -v
        env:
          PYTHON_VERSION: ${{ matrix.python }}

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t pyshell:test .
      - run: docker run --rm --network none pyshell:test --help
      - name: Check startup requirements with a read-only filesystem
        run: |
          requirements=$(mktemp)
          chmod 644 "$requirements"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=512m,mode=1777,exec \
            --mount "type=bind,src=$requirements,dst=/opt/pyshell/requirements.txt,readonly" \
            pyshell:test --help
          printf 'invalid requirement !!!\n' > "$requirements"
          if docker run --rm --network none --read-only \
            --tmpfs /tmp:size=512m,mode=1777,exec \
            --mount "type=bind,src=$requirements,dst=/opt/pyshell/requirements.txt,readonly" \
            pyshell:test --help; then
            exit 1
          fi
      - name: Check container permissions and workspace
        run: |
          docker run --rm --network none --entrypoint python pyshell:test -c '
          import os
          from pathlib import Path
          import pyshell
          assert os.getuid() != 0
          assert Path.cwd() == Path("/workspace")
          path = Path("smoke.txt")
          path.write_text("ok")
          assert path.read_text() == "ok"
          '
