name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag and commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tag must be vMAJOR.MINOR.PATCH without leading zeros")
          with open("src/api/pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit("Release tag must match the version in src/api/pyproject.toml")
          PY
          git fetch --unshallow --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/${DEFAULT_BRANCH}"

  tests:
    needs: validate-release
    uses: ./.github/workflows/tests.yml
    with:
      export-image: true

  publish-image:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyshell-image
          path: ${{ runner.temp }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        env:
          IMAGE: ghcr.io/xlonglink/pyshell
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/pyshell.tar"
          docker tag pyshell:test "${IMAGE}:${RELEASE_TAG}"
          docker push "${IMAGE}:${RELEASE_TAG}"
          if latest_pull=$(docker pull "${IMAGE}:latest" 2>&1); then
            current_version=$(docker image inspect "${IMAGE}:latest" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            promote_latest=$(CURRENT_VERSION="$current_version" python3 - <<'PY'
          import os
          import re

          def version(value):
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value)
              if match is None:
                  raise SystemExit(f"Invalid image version: {value!r}")
              return tuple(map(int, match.groups()))

          print("true" if version(os.environ["RELEASE_TAG"]) >= version(os.environ["CURRENT_VERSION"]) else "false")
          PY
            )
          elif [[ "$latest_pull" == *"manifest unknown"* ]]; then
            promote_latest=true
          else
            printf '%s\n' "$latest_pull" >&2
            exit 1
          fi
          if [[ "$promote_latest" == true ]]; then
            docker tag pyshell:test "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          else
            echo "Skipping latest: ${RELEASE_TAG} is older than ${current_version}"
          fi

  publish-github-release:
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
