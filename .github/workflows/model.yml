name: Model

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Bootstrap a new model repository and publish the result
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}

jobs:
  changes:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$NUMBER" --name-only | python3 model/ci.py changes

  evaluate:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.action != 'closed' && needs.changes.outputs.relevant == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, rtx]
    environment: model-training
    timeout-minutes: 180
    concurrency:
      group: model-gpu
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
      BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && '--bootstrap' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Check GPU and build execution container
        run: |
          echo "RUN_DIR=$RUNNER_TEMP/model-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          nvidia-smi
          docker build --target runtime -t pyshell-pyshell:latest -f src/api/Dockerfile src
      - name: Load accepted model
        run: uv run --project model/benchmark --locked --python 3.12 python model/ci.py baseline --directory "$RUN_DIR" $BOOTSTRAP
      - name: Test and train candidate
        run: |
          uv run --project model/train --locked --extra cpu --python 3.12 pytest model/train/tests
          uv run --project model/train --locked --extra cuda --python 3.12 python model/ci.py train --directory "$RUN_DIR"
      - name: Test current benchmark
        env:
          PYTHONPATH: src/api/src
        run: uv run --project model/benchmark --locked --extra cuda --extra data --python 3.12 pytest model/benchmark/tests
      - name: Fingerprint accepted-model evaluation
        id: baseline-key
        if: env.BOOTSTRAP == ''
        run: uv run --project model/benchmark --locked --extra cuda --extra data --python 3.12 python -m model.cache key --directory "$RUN_DIR"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: baseline-cache
        if: env.BOOTSTRAP == ''
        with:
          path: .baseline-cache
          key: ${{ steps.baseline-key.outputs.key }}
      - name: Restore accepted-model evaluation
        if: env.BOOTSTRAP == '' && steps.baseline-cache.outputs.cache-hit == 'true'
        run: uv run --project model/benchmark --locked --extra cuda --extra data --python 3.12 python -m model.cache restore --directory "$RUN_DIR"
      - name: Evaluate accepted model with current benchmark
        if: env.BOOTSTRAP == '' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: >-
          uv run --project model/benchmark --locked --extra cuda --extra data --python 3.12
          python model/ci.py evaluate --directory "$RUN_DIR"
          --adapter baseline --output baseline.jsonl
      - name: Store accepted-model evaluation
        if: github.ref == 'refs/heads/main' && env.BOOTSTRAP == '' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: uv run --project model/benchmark --locked --extra cuda --extra data --python 3.12 python -m model.cache store --directory "$RUN_DIR"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: github.ref == 'refs/heads/main' && env.BOOTSTRAP == '' && steps.baseline-cache.outputs.cache-hit != 'true'
        with:
          path: .baseline-cache
          key: ${{ steps.baseline-key.outputs.key }}
      - name: Evaluate candidate with current benchmark
        run: >-
          uv run --project model/benchmark --locked --extra cuda --extra data --python 3.12
          python model/ci.py evaluate --directory "$RUN_DIR"
      - name: Require strict improvement
        run: python3 model/ci.py report --directory "$RUN_DIR" $BOOTSTRAP
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: model-candidate
          path: |
            ${{ env.RUN_DIR }}/candidate/adapter_*
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/*.jsonl
          if-no-files-found: error
          retention-days: 30

  model-quality:
    needs: [changes, evaluate]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Check model result
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RESULT: ${{ needs.evaluate.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$RESULT" = success
          else
            test "$CHANGES" = success
            if [ "$RELEVANT" = true ]; then test "$RESULT" = success; fi
          fi

  publish:
    needs: changes
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: model-publishing
    permissions:
      contents: read
      actions: read
    concurrency:
      group: model-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Find tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          RUN=$(gh run list --workflow model.yml --event pull_request --commit "$HEAD" --status success --json databaseId --jq '.[0].databaseId // empty')
          test -n "$RUN"
          gh run download "$RUN" --name model-candidate --dir candidate
          test -f candidate/metrics.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
      - name: Publish accepted adapter and scores
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --project model/benchmark --locked --python 3.12 python model/ci.py publish --directory candidate

  bootstrap:
    needs: [evaluate, model-quality]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: model-publishing
    concurrency:
      group: model-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-candidate
          path: candidate
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --project model/benchmark --locked --python 3.12 python model/ci.py publish --directory candidate

  readme:
    needs: [publish, bootstrap]
    if: always() && (needs.publish.result == 'success' || needs.bootstrap.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: model-publishing
    permissions:
      contents: write
    concurrency:
      group: model-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
      - name: Update accepted model statistics
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --project model/benchmark --locked --python 3.12 python model/ci.py readme --directory "$RUNNER_TEMP/model-readme"
