[project]
name = "pyshell"
version = "0.1.1"
description = "A Python-only terminal agent with immediate execution and feedback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66.0,<3",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
pyshell = "pyshell.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyshell"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = [
    "F", "UP", "D", "DTZ", "I", "ICN", "PIE", "RET", "ARG", "N",
    "PERF", "PTH", "A", "S", "ASYNC", "ANN", "B006", "E302", "E305",
    "E262", "E265", "C403", "C419",
    "PGH003", "PT", "RUF100", "TID252",
]
ignore = ["D100", "D104", "D202"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N803", "S"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true
split-on-trailing-comma = false
