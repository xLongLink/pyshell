[project]
name = "pyshell"
version = "0.1.1"
description = "A Python-only terminal agent with immediate execution and feedback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66.0,<3",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
pyshell = "pyshell.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyshell"]
